name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run game smoke test
        run: node qa-smoke.cjs

      - name: Verify release root and cache version
        shell: bash
        run: |
          test -f index.html
          test -f VERSION.txt
          RELEASE_VERSION="$(tr -d '\r\n' < VERSION.txt)"
          test -n "$RELEASE_VERSION"
          grep -q "v=$RELEASE_VERSION" index.html
          grep -q "VERSION $RELEASE_VERSION" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

